# Isolated voice-editing acceptance stack. Never shares production data volumes.
name: voicedeck-voice-factory
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: voicedeck
      POSTGRES_USER: voicedeck
      POSTGRES_PASSWORD: local-factory-only
    volumes: ["factory-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicedeck"]
      interval: 3s
      retries: 20
  app:
    image: voicedeck-app:voice-factory
    ports: ["127.0.0.1:8089:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/voicedeck
      DB_USER: voicedeck
      DB_PASSWORD: local-factory-only
      MODE: live
      SLIDE_MODE: designer
      MODEL_CONFIG: /models/config.json
      LLM_URL: http://host.docker.internal:11434/v1
      LLM_MODEL: qwen3.8:27b
      EMBEDDING_BACKEND: ollama
      EMBEDDING_URL: http://host.docker.internal:11434/v1
      EMBEDDING_MODEL: bge-m3-embed
      EMBEDDING_DIMENSION: 1024
      DESIGNER_URL: http://designer:8090
      DESIGNER_PUBLIC_URL: http://localhost:8091
      ALLOWED_ORIGIN: http://localhost:5174
    volumes:
      - "${VOICEDECK_MODELS_DIR:?Set VOICEDECK_MODELS_DIR}:/models:ro"
      - "${VOICEDECK_NATIVE_DIR:?Set VOICEDECK_NATIVE_DIR}:/native:ro"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: {condition: service_healthy}
      designer: {condition: service_started}
  designer:
    image: voicedeck-designer:editor
    ports: ["127.0.0.1:8091:8090"]
    environment:
      PYTHONPATH: /app/src
      DESIGNER_LLM_URL: http://host.docker.internal:11434/v1
      DESIGNER_LLM_MODEL: qwen3.8:27b
      DESIGNER_LLM_PROTOCOL: ollama
      DESIGNER_LLM_NUM_CTX: 8192
      DESIGNER_EDITOR_LLM_URL: http://host.docker.internal:11434/v1
      DESIGNER_EDITOR_LLM_MODEL: qwen3.8:27b
      DESIGNER_EDITOR_LLM_PROTOCOL: ollama
      DESIGNER_EDITOR_DEADLINE_S: 12
      DESIGNER_EDITOR_NUM_CTX: 8192
      DESIGNER_ALLOWED_ORIGINS: http://localhost:5174,http://localhost:8089
      DESIGNER_DEMO_DIR: /app/demo
    volumes:
      - "factory-designer:/app/data"
      - "./designer/src:/app/src:ro"
      - "./designer/skills:/app/skills:ro"
      - "./demo:/app/demo:ro"
    extra_hosts: ["host.docker.internal:host-gateway"]
volumes:
  factory-postgres:
  factory-designer:
