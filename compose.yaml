services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: voicedeck
      POSTGRES_USER: voicedeck
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicedeck"]
      interval: 3s
      retries: 20
  app:
    build: .
    ports: ["127.0.0.1:${APP_PORT:-8088}:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/voicedeck
      DB_USER: voicedeck
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      MODE: ${MODE:-demo}
      SLIDE_MODE: ${SLIDE_MODE:-sketch}
      MODEL_CONFIG: /models/config.json
      LLM_URL: ${LLM_URL:-http://host.docker.internal:8000/v1}
      LLM_MODEL: ${LLM_MODEL:-deckgen}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-deckgen-small}
      ALLOWED_ORIGIN: http://localhost:${APP_PORT:-8088}
    volumes: ["./models:/models:ro", "./native:/native:ro"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  postgres-data:
