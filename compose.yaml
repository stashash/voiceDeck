services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: voicedeck
      POSTGRES_USER: voicedeck
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicedeck"]
      interval: 3s
      retries: 20
  app:
    build: .
    ports: ["127.0.0.1:${APP_PORT:-8088}:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/voicedeck
      DB_USER: voicedeck
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      MODE: ${MODE:-demo}
      SLIDE_MODE: ${SLIDE_MODE:-sketch}
      MODEL_CONFIG: /models/config.json
      LLM_URL: ${LLM_URL:-http://host.docker.internal:8000/v1}
      LLM_MODEL: ${LLM_MODEL:-deckgen}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-deckgen-small}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-ollama}
      EMBEDDING_URL: ${EMBEDDING_URL:-http://host.docker.internal:11434/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3-embed}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      DESIGNER_URL: http://designer:8090
      DESIGNER_DESIGN_SYSTEM_ID: ${DESIGNER_DESIGN_SYSTEM_ID:-}
      ALLOWED_ORIGIN: http://localhost:${APP_PORT:-8088}
    volumes: ["./models:/models:ro", "./native:/native:ro"]
    depends_on:
      db: {condition: service_healthy}
      designer: {condition: service_started}
  designer:
    build: ./designer
    ports: ["127.0.0.1:8090:8090"]
    environment:
      DESIGNER_LLM_URL: ${DESIGNER_LLM_URL:-http://host.docker.internal:1234/v1}
      DESIGNER_LLM_MODEL: ${DESIGNER_LLM_MODEL:-qwen/qwen3.8-27b}
      DESIGNER_LIVE_LLM_URL: ${DESIGNER_LIVE_LLM_URL:-}
      DESIGNER_LIVE_LLM_MODEL: ${DESIGNER_LIVE_LLM_MODEL:-}
      DESIGNER_ALLOWED_ORIGINS: ${DESIGNER_ALLOWED_ORIGINS:-http://localhost:${APP_PORT:-8088}}
    volumes: ["designer-data:/app/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
volumes:
  postgres-data:
  designer-data:
