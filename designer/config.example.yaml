# Пример настроек сервиса «Цифровой дизайнер презентаций».
# Скопируйте в config.yaml рядом с запуском и правьте под свою машину.
# Путь к файлу можно переопределить переменной окружения DESIGNER_CONFIG.
# Любое поле здесь можно перекрыть переменной окружения DESIGNER_<ИМЯ_ПОЛЯ>
# заглавными буквами, например llm_url -> DESIGNER_LLM_URL.

# Адрес и имя модели для сборки плана, слотов и аудита.
llm_url: http://127.0.0.1:1234/v1
llm_model: qwen/qwen3.8-27b

# Модель живого режима (слайд из фрагмента речи), если она должна отличаться
# от основной. Пусто — используется llm_url и llm_model выше.
live_llm_url:
live_llm_model:

# Каталог для пакетов дизайн-систем и готовых колод.
data_dir: ./data

# Порт HTTP-сервиса.
port: 8090

# Разрешённые адреса для CORS, списком. Пусто — заголовки CORS не добавляются.
allowed_origins: []

# Движок конвертации pptx в pdf и картинки слайдов: libreoffice, powerpoint
# или пусто для автовыбора первого доступного на машине.
converter:

# Сколько слайдов строить, если бриф не задаёт число явно.
slide_count: 12

# Какие варианты вёрстки строить по умолчанию.
variants: [a]
