[project]
name = "designer"
version = "0.1.0"
description = "Цифровой дизайнер презентаций: разбор pptx-шаблона, план, вёрстка, аудит, экспорт"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.2",
    "pydantic>=2.7",
    "lxml>=5.0",
    "Pillow>=10.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
